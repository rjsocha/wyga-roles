---
- name: "Create temporary remote working directory..."
  check_mode: false
  ansible.builtin.tempfile:
    state: directory
    suffix: "-sign-ca-host-keys"
  changed_when: false
  register: _tmp

- name: "Create temporary local working directory..."
  check_mode: false
  ansible.builtin.tempfile:
    state: directory
    suffix: "-sign-ca-host-keys"
  register: _ltmp
  changed_when: false
  delegate_to: localhost
