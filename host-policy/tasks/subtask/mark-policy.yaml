---
- name: "Create {{ host_policy_dir }}/policy ..."
  block:
    - name: "Create policy marker ..."
      include_role:
        name: wyga/marker
      vars:
        marker: policy
        marker_content: "{{ host.hostname }}"
        marker_mode: "0600"

    - name: "Trigger any pending handlers ..."
      meta: flush_handlers

    - name: "Trigger reboot ..."
      debug:
        msg: "."
      changed_when: true
      notify:
        - reboot-host
      when: marker_written.changed
