user www-data;
worker_processes {{ nginx_worker_processes }};
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log{{ (' ' ~ nginx_log_error) if nginx_log_error else '' }};
include /etc/nginx/modules-enabled/*.conf;

events {
  worker_connections {{ nginx_worker_connections or 768 }};
}

http {
  sendfile on;
  tcp_nopush on;
  types_hash_max_size 2048;
  server_tokens build;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

{% for name, format in nginx_log_formats.items() %}
  log_format {{ name }} '{{ format }}';
{% endfor %}
  access_log {{ 'off' if nginx_log_access == 'off' else '/var/log/nginx/access.log' ~ ((' ' ~ nginx_log_access) if nginx_log_access else '') }};

  gzip on;

  include /etc/nginx/conf.d/*.conf;
  include /etc/nginx/sites-enabled/*;
}
