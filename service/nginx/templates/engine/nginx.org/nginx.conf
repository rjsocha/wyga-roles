{% for module in nginx_module_files %}
load_module {{ module }};
{% endfor %}
user nginx;
worker_processes {{ nginx_worker_processes }};

error_log /var/log/nginx/error.log {{ nginx_log_error or 'notice' }};
pid /run/nginx.pid;

events {
  worker_connections {{ nginx_worker_connections or 1024 }};
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
{% for name, format in nginx_log_formats.items() %}
  log_format {{ name }} '{{ format }}';
{% endfor %}

  access_log {{ 'off' if nginx_log_access == 'off' else '/var/log/nginx/access.log ' ~ (nginx_log_access or 'main') }};

  sendfile on;

  keepalive_timeout 65;

  include /etc/nginx/conf.d/*.conf;
}
