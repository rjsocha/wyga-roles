needrestart_binary: /usr/sbin/needrestart

# needrestart decides for itself what it restarts: $nrconf{override_rc} in
# /etc/needrestart/needrestart.conf and its conf.d holds the units it refuses.
# The tables below describe only those refused units - whatever needrestart
# restarts on its own never needs an entry here, and adding one would only
# duplicate a decision that already lives in needrestart.

needrestart_allow:
  - bird.service
  - libvirtd.service
  - systemd-logind.service
  - unattended-upgrades.service
  - virtlogd.service

needrestart_action:
  virtlogd.service: reload

needrestart_skip:
  apt-daily.service: "runs apt itself"
  apt-daily-upgrade.service: "runs apt itself"

needrestart_gate:
  systemd-logind.service: "its restart reaps stale session scopes, killing anything started by hand in an old login session"

needrestart_follow:
  systemd-logind.service:
    - unattended-upgrades.service
    - polkit.service
    - omd.service

needrestart_reboot:
  - dbus.service
  - dbus-broker.service

needrestart_kernel_state:
  "0": unknown
  "1": current
  "2": "ABI upgrade pending, reboot required"
  "3": "version upgrade pending, reboot required"

needrestart_microcode_state:
  "0": unknown
  "1": current
  "2": "obsolete, reboot required"
