- name: "Needrestart / Maintenance / Load policy ..."
  include_role:
    name: wyga/load-policy
  when: host is not defined

- name: "Needrestart / Maintenance / Check configuration ..."
  assert:
    that:
      - host.security.restart.maintenance | default([], true) is sequence
      - host.security.restart.maintenance | default([], true) is not string
      - host.security.restart.maintenance | default([], true) is not mapping
    fail_msg: "security.restart.maintenance: a list of unit names"
    quiet: true

- name: "Needrestart / Maintenance / Look for a running apt ..."
  shell: |
    systemctl is-active --quiet apt-daily.service && printf '%s\n' apt-daily.service
    systemctl is-active --quiet apt-daily-upgrade.service && printf '%s\n' apt-daily-upgrade.service
    [[ -e /var/run/unattended-upgrades.pid ]] && printf '%s\n' unattended-upgrade
    exit 0
  args:
    executable: /bin/bash
  check_mode: false
  changed_when: false
  register: needrestart_apt

- name: "Needrestart / Maintenance / An apt run is in progress ..."
  assert:
    that:
      - needrestart_apt.stdout_lines | length == 0
    fail_msg: "in progress: {{ needrestart_apt.stdout_lines | join(', ') }} - run this after the upgrade finishes"
    quiet: true

- name: "Needrestart / Maintenance / Find needrestart ..."
  stat:
    path: "{{ needrestart_binary }}"
  check_mode: false
  register: needrestart_present

- name: "Needrestart / Maintenance / Needrestart is not installed ..."
  assert:
    that:
      - needrestart_present.stat.exists
    fail_msg: "{{ needrestart_binary }} not found: the host policy has no security.restart"
    quiet: true

- name: "Needrestart / Maintenance / Read the report ..."
  command: "{{ needrestart_binary }} -b -r l"
  check_mode: false
  changed_when: false
  register: needrestart_report

- name: "Needrestart / Maintenance / Parse the report ..."
  set_fact:
    needrestart_service: "{{ needrestart_report.stdout_lines | select('match', '^NEEDRESTART-SVC: ') | map('regex_replace', '^NEEDRESTART-SVC: +', '') | list }}"
    needrestart_session: "{{ needrestart_report.stdout_lines | select('match', '^NEEDRESTART-SESS: ') | map('regex_replace', '^NEEDRESTART-SESS: +', '') | list }}"
    needrestart_kernel: "{{ needrestart_report.stdout_lines | select('match', '^NEEDRESTART-KSTA: ') | map('regex_replace', '^NEEDRESTART-KSTA: +', '') | list | first | default('0') }}"
    needrestart_microcode: "{{ needrestart_report.stdout_lines | select('match', '^NEEDRESTART-UCSTA: ') | map('regex_replace', '^NEEDRESTART-UCSTA: +', '') | list | first | default('0') }}"
    needrestart_maintenance: "{{ host.security.restart.maintenance | default([], true) | map('regex_replace', '^([^.]+)$', '\\1.service') | list }}"

- name: "Needrestart / Maintenance / Read the plan ..."
  shell: |
    set -eufo pipefail
    IFS=$'\t\n'
    LC_ALL=C {{ needrestart_binary }} -r l 2>&1 | awk '
      /^Services to be restarted:$/ { group="restart"; next }
      /^Service restarts being deferred:$/ { group="deferred"; next }
      /^Service restarts being refused by systemd:$/ { group="refused"; next }
      /^[^ ]/ { group=""; next }
      group == "" { next }
      NF == 0 { next }
      $1 == "systemctl" && $2 == "restart" { for(i = 3; i <= NF; i++) print group, $i; next }
      $1 ~ /\// { parts = split($1, part, "/"); print group, part[parts]; next }
      { print group, $1 }
    '
  args:
    executable: /bin/bash
  check_mode: false
  changed_when: false
  register: needrestart_plan

- name: "Needrestart / Maintenance / Parse the plan ..."
  set_fact:
    needrestart_automatic: "{{ needrestart_plan.stdout_lines | select('match', '^restart ') | map('regex_replace', '^restart ', '') | list }}"
    needrestart_deferred: "{{ needrestart_plan.stdout_lines | select('match', '^deferred ') | map('regex_replace', '^deferred ', '') | list }}"
    needrestart_refused: "{{ needrestart_plan.stdout_lines | select('match', '^refused ') | map('regex_replace', '^refused ', '') | list }}"

- name: "Needrestart / Maintenance / The plan does not account for every service ..."
  assert:
    that:
      - needrestart_service | difference(needrestart_automatic | union(needrestart_deferred) | union(needrestart_refused)) | length == 0
    fail_msg: "not in the plan: {{ needrestart_service | difference(needrestart_automatic | union(needrestart_deferred) | union(needrestart_refused)) | join(', ') }} - the output format of needrestart changed, the role cannot tell what it would restart"
    quiet: true

- name: "Needrestart / Maintenance / Look for daemons in session scopes ..."
  shell: |
    set -eufo pipefail
    IFS=$'\t\n'
    IGNORE="bash sh dash zsh sshd sshd-session ps grep awk sed cat tail head python3 python sudo su login systemd-cgls tmux screen"
    MY=$(cut -d: -f3 /proc/self/cgroup | head -1)
    for FILE in /run/systemd/sessions/[0-9]*
    do
      if [[ ! -f ${FILE} ]]
      then
        continue
      fi
      SCOPE=$(sed -n 's/^SCOPE=//p' "${FILE}")
      LEADER=$(sed -n 's/^LEADER=//p' "${FILE}")
      if [[ -z ${SCOPE} ]]
      then
        continue
      fi
      CG=$(systemctl show "${SCOPE}" -p ControlGroup --value 2>/dev/null)
      if [[ -z ${CG} ]] || [[ ${CG} == "${MY}" ]] || [[ ! -r /sys/fs/cgroup${CG}/cgroup.procs ]]
      then
        continue
      fi
      FOUND=""
      while read -r PID
      do
        if [[ ! -r /proc/${PID}/comm ]]
        then
          continue
        fi
        COMM=$(cat "/proc/${PID}/comm")
        if [[ " ${IGNORE} " == *" ${COMM} "* ]] || [[ " ${FOUND} " == *" ${COMM} "* ]]
        then
          continue
        fi
        FOUND+=" ${COMM}"
      done < "/sys/fs/cgroup${CG}/cgroup.procs"
      if [[ -z ${FOUND} ]]
      then
        continue
      fi
      if kill -0 "${LEADER}" 2>/dev/null
      then
        printf '%s leader alive:%s\n' "${SCOPE}" "${FOUND}"
      else
        printf '%s LEADER GONE:%s\n' "${SCOPE}" "${FOUND}"
      fi
    done
  args:
    executable: /bin/bash
  check_mode: false
  changed_when: false
  register: needrestart_scope

- name: "Needrestart / Maintenance / Look for user managers on old code ..."
  shell: |
    set -eufo pipefail
    IFS=$'\t\n'
    for UNIT in $(systemctl list-units --state=active --no-legend --plain 'user@*.service' | cut -d' ' -f1)
    do
      CG=$(systemctl show "${UNIT}" -p ControlGroup --value)
      if [[ -z ${CG} ]] || [[ ! -d /sys/fs/cgroup${CG} ]]
      then
        continue
      fi
      OLD=""
      for PROCS in $(find "/sys/fs/cgroup${CG}" -name cgroup.procs)
      do
        while read -r PID
        do
          if [[ ! -r /proc/${PID}/maps ]]
          then
            continue
          fi
          if [[ $(readlink "/proc/${PID}/exe") == *"(deleted)" ]] ||
             awk '$NF == "(deleted)" &&
                  $6 !~ /^\/(memfd:|SYSV|dev\/|run\/|var\/run\/|tmp\/|var\/tmp\/|\[aio\]|drm)/ &&
                  $6 !~ /\/#[0-9]+$/ { found = 1; exit }
                  END { exit !found }' "/proc/${PID}/maps"
          then
            OLD="yes"
            break
          fi
        done < "${PROCS}" 2>/dev/null
        if [[ -n ${OLD} ]]
        then
          break
        fi
      done
      if [[ -n ${OLD} ]]
      then
        printf '%s\n' "${UNIT}"
      fi
    done
  args:
    executable: /bin/bash
  check_mode: false
  changed_when: false
  register: needrestart_manager

- name: "Needrestart / Maintenance / Gate by session scopes ..."
  set_fact:
    needrestart_gated: "{{ needrestart_deferred | intersect(needrestart_gate | list) if needrestart_scope.stdout_lines | select('search', 'LEADER GONE') | length > 0 else [] }}"

- name: "Needrestart / Maintenance / Plan ..."
  set_fact:
    needrestart_skipped: "{{ needrestart_deferred | intersect(needrestart_skip | list) }}"
    needrestart_rebootable: "{{ needrestart_deferred | intersect(needrestart_reboot) }}"
    needrestart_selected: "{{ needrestart_deferred | difference(needrestart_skip | list) | difference(needrestart_reboot) | difference(needrestart_gated) | intersect(needrestart_allow | union(needrestart_maintenance)) }}"
    needrestart_reported: "{{ needrestart_deferred | difference(needrestart_skip | list) | difference(needrestart_reboot) | difference(needrestart_allow | union(needrestart_maintenance)) }}"
    needrestart_reboot_required: "{{ needrestart_kernel in ['2', '3'] or needrestart_microcode == '2' or needrestart_service | intersect(needrestart_reboot) | length > 0 }}"

- name: "Needrestart / Maintenance / Plan by action ..."
  set_fact:
    needrestart_reload: "{{ needrestart_selected | intersect(needrestart_action | dict2items | selectattr('value', 'eq', 'reload') | map(attribute='key') | list) }}"
    needrestart_plain: "{{ needrestart_selected | difference(needrestart_action | list) }}"

- name: "Needrestart / Maintenance / Plan the restart order ..."
  set_fact:
    needrestart_followed: "{{ needrestart_follow | dict2items | selectattr('key', 'in', needrestart_plain) | map(attribute='value') | flatten | unique }}"

- name: "Needrestart / Maintenance / Look for the units to restart after ..."
  shell: |
    set -eufo pipefail
    IFS=$'\t\n'
    for UNIT in {{ needrestart_followed | join(' ') }}
    do
      if systemctl cat "${UNIT}" > /dev/null 2>&1
      then
        printf '%s\n' "${UNIT}"
      fi
    done
  args:
    executable: /bin/bash
  check_mode: false
  changed_when: false
  register: needrestart_follower
  when: needrestart_followed | length > 0

- name: "Needrestart / Maintenance / Plan the restart list ..."
  set_fact:
    needrestart_restart: "{{ (needrestart_follow | list | intersect(needrestart_plain)) + (needrestart_plain | difference(needrestart_follow | list) | difference(needrestart_followed)) }}"
    needrestart_after: "{{ needrestart_follower.stdout_lines | default([], true) }}"

- name: "Needrestart / Maintenance / Nothing to do ..."
  debug:
    msg: "nothing runs old code"
  when: needrestart_service | length == 0

- name: "Needrestart / Maintenance / Plan: needrestart restarts these itself ..."
  debug:
    msg: "{{ needrestart_automatic }}"
  when: needrestart_automatic | length > 0

- name: "Needrestart / Maintenance / Plan: restart ..."
  debug:
    msg: "{{ needrestart_restart }}"
  when: needrestart_restart | length > 0

- name: "Needrestart / Maintenance / Plan: try-restart after the units above ..."
  debug:
    msg: "{{ needrestart_after }}"
  when: needrestart_after | length > 0

- name: "Needrestart / Maintenance / Plan: reload ..."
  debug:
    msg: "{{ needrestart_reload }}"
  when: needrestart_reload | length > 0

- name: "Needrestart / Maintenance / Plan: user managers to restart ..."
  debug:
    msg: "{{ needrestart_manager.stdout_lines }}"
  when: needrestart_manager.stdout_lines | length > 0

- name: "Needrestart / Maintenance / Plan: skipped by the role ..."
  debug:
    msg: "{{ needrestart_skipped | zip(needrestart_skipped | map('extract', needrestart_skip)) | map('join', ': ') | list }}"
  when: needrestart_skipped | length > 0

- name: "Needrestart / Maintenance / Plan: systemd refuses to restart these ..."
  debug:
    msg: "{{ needrestart_refused }}"
  when: needrestart_refused | length > 0

- name: "Needrestart / Maintenance / Plan: deferred by needrestart, no entry in the table or the policy ..."
  debug:
    msg: "{{ needrestart_reported }}"
  when: needrestart_reported | length > 0

- name: "Needrestart / Maintenance / Plan: held back, a daemon lives in a login session scope ..."
  debug:
    msg: "{{ needrestart_gated | zip(needrestart_gated | map('extract', needrestart_gate)) | map('join', ': ') | list }}"
  when: needrestart_gated | length > 0

- name: "Needrestart / Maintenance / Daemons live in a login session scope ..."
  debug:
    msg: "{{ needrestart_scope.stdout_lines + ['a restart of systemd-logind would kill these, start them from a unit or with systemd-run --slice=system.slice'] }}"
  when: needrestart_scope.stdout_lines | length > 0

- name: "Needrestart / Maintenance / Plan: reboot required ..."
  debug:
    msg:
      - "kernel: {{ needrestart_kernel_state[needrestart_kernel] | default('unknown') }}"
      - "microcode: {{ needrestart_microcode_state[needrestart_microcode] | default('unknown') }}"
  when: needrestart_kernel in ["2", "3"] or needrestart_microcode == "2"

- name: "Needrestart / Maintenance / Plan: only a host reboot fixes these ..."
  debug:
    msg: "{{ needrestart_rebootable }}"
  when: needrestart_rebootable | length > 0

- name: "Needrestart / Maintenance / Plan: sessions to log in again ..."
  debug:
    msg: "{{ needrestart_session }}"
  when: needrestart_session | length > 0

- name: "Needrestart / Maintenance / Look for outdated qemu guests ..."
  shell: |
    set -eufo pipefail
    IFS=$'\t\n'
    SLICE=/sys/fs/cgroup/machine.slice
    if [[ ! -d ${SLICE} ]]
    then
      exit 0
    fi
    SEEN=""
    for PROCS in $(find "${SLICE}" -path '*/machine-qemu*.scope/*' -name cgroup.procs 2>/dev/null)
    do
      if [[ ! -r ${PROCS} ]]
      then
        continue
      fi
      while read -r PID
      do
        if [[ " ${SEEN} " == *" ${PID} "* ]] || [[ ! -r /proc/${PID}/maps ]]
        then
          continue
        fi
        SEEN+=" ${PID}"
        read -r -d '' COMMAND < "/proc/${PID}/cmdline" || COMMAND=""
        if [[ ${COMMAND} != *qemu-system* ]]
        then
          continue
        fi
        NAME=$(tr '\0' '\n' < "/proc/${PID}/cmdline" | sed -n 's/^guest=\([^,]*\).*/\1/p')
        if [[ -z ${NAME} ]]
        then
          NAME="pid ${PID}"
        fi
        if [[ $(readlink "/proc/${PID}/exe") == *"(deleted)" ]]
        then
          printf '%s\n' "${NAME}"
          continue
        fi
        if awk '$NF == "(deleted)" &&
                $6 !~ /^\/(memfd:|SYSV|dev\/|run\/|var\/run\/|tmp\/|var\/tmp\/|\[aio\]|drm)/ &&
                $6 !~ /\/#[0-9]+$/ { found = 1; exit }
                END { exit !found }' "/proc/${PID}/maps"
        then
          printf '%s\n' "${NAME}"
        fi
      done < "${PROCS}" 2>/dev/null
    done
  args:
    executable: /bin/bash
  check_mode: false
  changed_when: false
  register: needrestart_guest

- name: "Needrestart / Maintenance / Plan: guests running outdated qemu binaries ..."
  debug:
    msg: "{{ needrestart_guest.stdout_lines + ['only a restart of the guest replaces its qemu process: virsh shutdown and virsh start, a reboot inside the guest keeps the old binaries'] }}"
  when: needrestart_guest.stdout_lines | length > 0

- name: "Needrestart / Maintenance / A host reboot replaces this run ..."
  debug:
    msg: "nothing restarted: reboot the host, or pass -eneedrestart_force=1 to restart the services anyway"
  when:
    - needrestart_reboot_required
    - needrestart_force is not defined

- name: "Needrestart / Maintenance / Apply ..."
  include_tasks: restart.yaml
  when:
    - not ansible_check_mode
    - needrestart_automatic | length > 0 or needrestart_selected | length > 0 or needrestart_manager.stdout_lines | length > 0
    - not needrestart_reboot_required or needrestart_force is defined
