- name: "Check if locale-gen is available ..."
  stat:
    path: /usr/sbin/locale-gen
  register: locale_gen_bin

- name: "Install locales ..."
  apt:
    name: locales
    state: present
    update_cache: true
  when: not locale_gen_bin.stat.exists

- name: "Generate locales ..."
  include_tasks: include/locale-gen.yaml
