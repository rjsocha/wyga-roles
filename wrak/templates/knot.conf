#jinja2: trim_blocks: True, lstrip_blocks: True
server:
    listen: [ {{ knot_listen | join(', ') }} ]

log:
  - target: syslog
    any: info

key:
  - id: {{ knot_tsig }}
    algorithm: hmac-sha256
    secret: {{ knot_tsig_secret }}

remote:
  - id: wrak_primary
    address: {{ knot_primary }}
{% if knot_via %}
    via: {{ knot_via }}
{% endif %}
    key: {{ knot_tsig }}

acl:
  - id: acl_wrak_notify
    address: {{ knot_primary_address }}
    key: {{ knot_tsig }}
    action: notify

zone:
{% for zone in knot_zones %}
  - domain: {{ zone }}
    master: wrak_primary
    acl: acl_wrak_notify
{% endfor %}
